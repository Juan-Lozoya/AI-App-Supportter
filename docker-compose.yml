services:
  backend:
    build:
      context: ./backend
      target: dev
    ports: ["8000:8000"]
    env_file: .env
    environment:
      AWS_PROFILE: ${AWS_PROFILE:-default}
    volumes:
      - ./backend/app:/app/app
      - ${AWS_CREDENTIALS_DIR}:/root/.aws:ro

  frontend:
    build:
      context: ./frontend
    ports: ["5173:5173"]
    environment:
      VITE_PROXY_TARGET: ${VITE_PROXY_TARGET}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on: [backend]
