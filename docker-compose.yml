services:
  backend:
    build:
      context: ./backend
      target: dev
      dockerfile: Dockerfile
    ports: ["8000:8000"]
    env_file: .env
    volumes:
      - ./backend/app:/app/app
      - ${HOME}/.aws:/root/.aws:ro
      - ${HOME}/.aws/login/cache:/root/.aws/login/cache
    environment:
      AWS_PROFILE: default
      AWS_REGION: us-east-2

  frontend:
    build:
      context: ./frontend
    ports: ["5173:5173"]
    environment:
      VITE_PROXY_TARGET: ${VITE_PROXY_TARGET}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on: [backend]
